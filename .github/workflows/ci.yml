name: SynapseQA CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Code Linter (oxlint)
      run: npm run lint

    - name: Build Web Application
      run: npm run build

    - name: Verify CLI Entrypoint
      run: node cli/bin/synapseqa.js --version

    - name: CLI dry run (no model call)
      run: node cli/bin/synapseqa.js --target=https://example.com --dry-run

  agent:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Run offline agent tests
      working-directory: agent
      run: python -m unittest -v
